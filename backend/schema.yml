components:
  schemas:
    EstadoEnum:
      enum:
      - PENDIENTE
      - EN_REVISION
      - APROBADO
      - RECHAZADO
      - TIMEOUT_APROBADO
      type: string
      description: |-
        * `PENDIENTE` - Pendiente
        * `EN_REVISION` - En revisión
        * `APROBADO` - Aprobado
        * `RECHAZADO` - Rechazado
        * `TIMEOUT_APROBADO` - Aprobado por timeout
    EstadoInvitacionEnum:
      enum:
      - PENDIENTE
      - ACEPTADO
      - RECHAZADO
      type: string
      description: |-
        * `PENDIENTE` - Pendiente
        * `ACEPTADO` - Aceptado
        * `RECHAZADO` - Rechazado
    Evidencia:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        habit_log:
          type: integer
          nullable: true
        usuario:
          type: integer
          readOnly: true
        s3_file_url:
          type: string
          format: uri
          maxLength: 500
        descripcion:
          type: string
          nullable: true
        fecha_creacion:
          type: string
          format: date-time
          readOnly: true
      required:
      - fecha_creacion
      - id
      - s3_file_url
      - usuario
    EvidenciaRequest:
      type: object
      properties:
        habit_log:
          type: integer
          nullable: true
        s3_file_url:
          type: string
          format: uri
          minLength: 1
          maxLength: 500
        descripcion:
          type: string
          nullable: true
      required:
      - s3_file_url
    FrequencyEnum:
      enum:
      - DAILY
      - WEEKDAYS
      - WEEKENDS
      - CUSTOM
      type: string
      description: |-
        * `DAILY` - Diario
        * `WEEKDAYS` - Días hábiles
        * `WEEKENDS` - Fines de semana
        * `CUSTOM` - Personalizado
    GoalTypeEnum:
      enum:
      - BOOL
      - NUM
      type: string
      description: |-
        * `BOOL` - Completado / No completado
        * `NUM` - Meta numérica
    Habit:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        name:
          type: string
          title: Nombre del hábito
          maxLength: 150
        description:
          type: string
          nullable: true
          title: Descripción
        frequency:
          $ref: '#/components/schemas/FrequencyEnum'
        goal_type:
          $ref: '#/components/schemas/GoalTypeEnum'
        target_value:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: 'Meta diaria (ej: 1 si es booleano, o cantidad de páginas,
            minutos, etc.)'
        unit:
          type: string
          nullable: true
          description: 'Ej: páginas, litros, minutos'
          maxLength: 50
        padrino_assignments:
          type: array
          items:
            $ref: '#/components/schemas/HabitPadrino'
          readOnly: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - padrino_assignments
      - updated_at
      - user
    HabitLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        habit:
          type: integer
        date:
          type: string
          format: date
          title: Fecha del registro
        estado:
          allOf:
          - $ref: '#/components/schemas/EstadoEnum'
          readOnly: true
        actual_value:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        notes:
          type: string
          nullable: true
          maxLength: 255
        revisado_por:
          type: integer
          readOnly: true
          nullable: true
        revisado_por_username:
          type: string
          readOnly: true
        fecha_envio:
          type: string
          format: date-time
          readOnly: true
        fecha_revision:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        motivo_rechazo:
          type: string
          nullable: true
