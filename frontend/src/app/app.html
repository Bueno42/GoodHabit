<div class="app-shell" [class.app-shell-menu-abierto]="menuAbierto">
  <aside id="main-navigation" class="sidebar">
    <button
      class="menu-toggle desktop-menu-toggle"
      type="button"
      aria-controls="main-navigation"
      [attr.aria-expanded]="menuAbierto"
      [attr.aria-label]="menuAbierto ? 'Contraer menú' : 'Expandir menú'"
      (click)="alternarMenu()">
      <span class="menu-toggle-icon" [class.menu-toggle-icon-abierto]="menuAbierto" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </span>
    </button>

    <nav class="navigation-content" aria-label="Navegación principal">
      <a routerLink="/dashboard" routerLinkActive="navigation-link-active" aria-label="Mi Dashboard" (click)="cerrarMenu()">
        <span class="navigation-icon" aria-hidden="true">🏠</span>
        <span class="navigation-label">Mi Dashboard</span>
      </a>
      <a routerLink="/buscar-padrino" routerLinkActive="navigation-link-active" aria-label="Buscar Padrinos" (click)="cerrarMenu()">
        <span class="navigation-icon" aria-hidden="true">🔍</span>
        <span class="navigation-label">Buscar Padrinos</span>
      </a>
      <a routerLink="/solicitudes" routerLinkActive="navigation-link-active" aria-label="Invitaciones" (click)="cerrarMenu()">
        <span class="navigation-icon" aria-hidden="true">📨</span>
        <span class="navigation-label">Invitaciones</span>
      </a>
      <a routerLink="/moderacion" routerLinkActive="navigation-link-active" aria-label="Moderación" (click)="cerrarMenu()">
        <span class="navigation-icon" aria-hidden="true">⚖️</span>
        <span class="navigation-label">Moderación</span>
      </a>
    </nav>
  </aside>

  @if (menuAbierto) {
    <button class="sidebar-backdrop" type="button" aria-label="Cerrar menú" (click)="cerrarMenu()"></button>
  }

  <div class="app-content">
    <header class="app-header">
      <button
        class="menu-toggle mobile-menu-toggle"
        type="button"
        aria-controls="main-navigation"
        [attr.aria-expanded]="menuAbierto"
        [attr.aria-label]="menuAbierto ? 'Cerrar menú' : 'Abrir menú'"
        (click)="alternarMenu()">
        <span class="menu-toggle-icon" [class.menu-toggle-icon-abierto]="menuAbierto" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </button>
      <a class="brand" routerLink="/dashboard">GoodHabit</a>
      <span class="header-spacer" aria-hidden="true"></span>
    </header>

    <main class="app-main">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
