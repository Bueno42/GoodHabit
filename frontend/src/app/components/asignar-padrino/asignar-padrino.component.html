<div class="asignar-padrino-container">
  <h3>Padrinos del Hábito</h3>

  <ul>
    @for (p of padrinosActivos; track p.id) {
      <li>
        <span>{{ p.padrino_nombre || p.padrino_username || 'Padrino ID: ' + p.padrino }}</span>
        <strong 
          [class.pendiente]="(p.estado || p.estado_invitacion) === 'PENDIENTE'" 
          [class.aprobado]="(p.estado || p.estado_invitacion) === 'ACEPTADO'">
          [{{ p.estado || p.estado_invitacion }}]
        </strong>
      </li>
    }
  </ul>

  <div class="form-group">
    <input 
      type="number" 
      [(ngModel)]="usuarioSeleccionadoId" 
      placeholder="ID de usuario a invitar" 
    />
    <button (click)="invitar()">Invitar</button>
  </div>

  @if (errorMensaje) {
    <p class="error-mensaje" style="color: red;">{{ errorMensaje }}</p>
  }
</div>
