<section class="buscador-container">
  <div class="buscador-card">
    <header class="buscador-header">
      <h2>Buscar Padrino</h2>
      <p>Elegí uno de tus hábitos y buscá a un amigo para que te supervise.</p>
    </header>

    <div class="formulario">
      <label for="habit-selection">1. Seleccioná el hábito:</label>
      <select
        id="habit-selection"
        [(ngModel)]="habitoSeleccionadoId"
        class="input-base">
        <option [ngValue]="null">-- Elegí un hábito --</option>
        @for (habito of misHabitos; track habito.id) {
          <option [ngValue]="habito.id">{{ habito.name }}</option>
        }
      </select>
    </div>

    <div class="formulario">
      <label for="username-search">2. Buscá por nombre de usuario:</label>
      <div class="busqueda-usuario">
        <input
          id="username-search"
          type="text"
          [(ngModel)]="terminoBusqueda"
          placeholder="Ej: juanperez..."
          class="input-base">
        <button type="button" class="btn-primario" (click)="buscarUsuario()">Buscar</button>
      </div>
    </div>
  </div>

  @if (usuariosEncontrados.length > 0) {
    <section class="resultados-card" aria-labelledby="results-heading">
      <h3 id="results-heading">Resultados</h3>
      <div class="lista-resultados">
        @for (usuario of usuariosEncontrados; track usuario.id) {
          <article class="card-usuario">
            <span class="nombre-usuario">{{ usuario.username }}</span>
            <button
              type="button"
              class="btn-secundario"
              (click)="enviarInvitacion(usuario.id)"
              [disabled]="!habitoSeleccionadoId">
              Invitar
            </button>
          </article>
        }
      </div>
    </section>
  }
</section>
