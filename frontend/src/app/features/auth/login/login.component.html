<section class="login-container" aria-labelledby="login-heading">
  <div class="login-card">
    <header class="login-header">
      <span class="login-eyebrow">BIENVENIDO/A A GOODHABIT</span>
      <h1 id="login-heading">Qué bueno verte</h1>
      <p>Iniciá sesión para continuar con tus hábitos.</p>
    </header>

    <form class="login-form" (ngSubmit)="login()">
      <div class="formulario">
        <label for="username">Usuario</label>
        <input
          id="username"
          name="username"
          type="text"
          [(ngModel)]="username"
          autocomplete="username"
          placeholder="Tu nombre de usuario"
          class="input-base"
          required>
      </div>

      <div class="formulario">
        <label for="password">Contraseña</label>
        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          autocomplete="current-password"
          placeholder="Tu contraseña"
          class="input-base"
          required>
      </div>
      
      @if (errorMessage) {
        <p class="login-error" role="alert">{{ errorMessage }}</p>
      }

      <button type="submit" class="btn-primario login-submit">
        Entrar a mi cuenta
      </button>
      <p style="margin-top: 16px; text-align: center; font-size: 0.85rem;">
  ¿No tenés cuenta? <a routerLink="/registro" style="color: #2563eb; font-weight: 600;">Registrate gratis</a>
</p>
    </form>
  </div>
</section>
