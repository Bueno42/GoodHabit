<section style="min-height: 85vh; display: flex; align-items: center; justify-content: center; padding: 16px;">
  <div style="width: 100%; max-width: 420px; background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 28px; box-shadow: 0 10px 25px rgb(15 23 42 / 6%);">
    <h2 style="margin: 0 0 6px; text-align: center; color: #1d4ed8;">Crear cuenta en GoodHabit</h2>
    <p style="margin: 0 0 20px; text-align: center; color: #6b7280; font-size: 0.9rem;">
      Registrate para gestionar tus hábitos y conectar con padrinos.
    </p>

    @if (errorMessage) {
      <p style="background: #fef2f2; color: #b91c1c; padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 14px;" role="alert">
        {{ errorMessage }}
      </p>
    }

    <form (ngSubmit)="registrar()" style="display: grid; gap: 14px;">
      <label style="font-size: 0.85rem; font-weight: 600;">
        Nombre de usuario
        <input
          type="text"
          name="username"
          [(ngModel)]="username"
          placeholder="Ej: mateolaccetta"
          required
          style="width: 100%; margin-top: 4px; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px;" />
      </label>

      <label style="font-size: 0.85rem; font-weight: 600;">
        Correo electrónico
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Ej: mateo@ejemplo.com"
          required
          style="width: 100%; margin-top: 4px; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px;" />
      </label>

      <label style="font-size: 0.85rem; font-weight: 600;">
        Contraseña (mínimo 6 caracteres)
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="••••••••"
          required
          style="width: 100%; margin-top: 4px; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px;" />
      </label>

      <label style="font-size: 0.85rem; font-weight: 600;">
        Confirmar contraseña
        <input
          type="password"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          placeholder="••••••••"
          required
          style="width: 100%; margin-top: 4px; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px;" />
      </label>

      <button
        type="submit"
        [disabled]="cargando"
        style="margin-top: 6px; padding: 11px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer;">
        {{ cargando ? 'Creando cuenta...' : 'Registrarme' }}
      </button>
    </form>

    <p style="margin: 18px 0 0; text-align: center; font-size: 0.85rem; color: #6b7280;">
      ¿Ya tenés cuenta?
      <a routerLink="/login" style="color: #2563eb; font-weight: 600; text-decoration: none;">Iniciá sesión acá</a>
    </p>
  </div>
</section>
