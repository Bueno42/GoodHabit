<section class="registro-container" aria-labelledby="registro-heading">
  <div class="registro-card">
    <h2 id="registro-heading">Crear cuenta en GoodHabit</h2>
    <p class="registro-intro">
      Registrate para gestionar tus hábitos y conectar con padrinos.
    </p>

    @if (errorMessage) {
      <p class="registro-error" role="alert">
        {{ errorMessage }}
      </p>
    }

    <form class="registro-form" (ngSubmit)="registrar()">
      <label>
        Nombre de usuario
        <input
          type="text"
          name="username"
          [(ngModel)]="username"
          placeholder="Ej: mateolaccetta"
          required />
      </label>

      <label>
        Correo electrónico
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Ej: mateo@ejemplo.com"
          required />
      </label>

      <label>
        Contraseña (mínimo 6 caracteres)
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="••••••••"
          required />
      </label>

      <label>
        Confirmar contraseña
        <input
          type="password"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          placeholder="••••••••"
          required />
      </label>

      <button type="submit" [disabled]="cargando">
        {{ cargando ? 'Creando cuenta...' : 'Registrarme' }}
      </button>
    </form>

    <p class="registro-login">
      ¿Ya tenés cuenta?
      <a routerLink="/login">Iniciá sesión acá</a>
    </p>
  </div>
</section>
