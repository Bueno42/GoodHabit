<section class="crear-habito-container">
  <form class="form-card" (ngSubmit)="guardarHabito()">
    <header class="form-header">
      <h2>Crear Nuevo Hábito</h2>
      <p>Definí un objetivo y empezá a construir una rutina.</p>
    </header>

    <div class="form-group">
      <label for="habit-name">Nombre del Hábito <span aria-hidden="true">*</span></label>
      <input
        id="habit-name"
        class="input-base"
        type="text"
        name="name"
        [(ngModel)]="nuevoHabito.name"
        placeholder="Ej. Leer 30 minutos"
        required>
    </div>

    <div class="form-group">
      <label for="habit-frequency">Frecuencia</label>
      <select id="habit-frequency" class="input-base" name="frequency" [(ngModel)]="nuevoHabito.frequency">
        <option value="DAILY">Todos los días</option>
        <option value="WEEKDAYS">Días hábiles</option>
        <option value="WEEKENDS">Fines de semana</option>
      </select>
    </div>

    <div class="form-group">
      <label for="habit-goal-type">Tipo de Meta</label>
      <select id="habit-goal-type" class="input-base" name="goal_type" [(ngModel)]="nuevoHabito.goal_type">
        <option value="BOOL">Completado / No Completado</option>
        <option value="NUM">Meta Numérica (Ej. 2000 ml)</option>
      </select>
    </div>

    @if (nuevoHabito.goal_type === 'NUM') {
      <div class="form-group">
        <label for="habit-target-value">Valor de la meta</label>
        <input
          id="habit-target-value"
          class="input-base"
          type="number"
          name="target_value"
          [(ngModel)]="nuevoHabito.target_value"
          min="1">
      </div>
    }

    <button class="crear-habito-submit" type="submit" [disabled]="cargando">
      {{ cargando ? 'Guardando...' : 'Crear Hábito' }}
    </button>

    @if (error) {
      <p class="msj-error" role="alert">{{ error }}</p>
    }
  </form>
</section>
