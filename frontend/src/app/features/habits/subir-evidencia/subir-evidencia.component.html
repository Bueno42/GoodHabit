<div style="max-width: 500px; margin: 50px auto; font-family: sans-serif; text-align: center;">
  <h2>Registrar Evidencia</h2>
  
  <div style="border: 2px dashed #ccc; padding: 40px; margin-bottom: 20px; border-radius: 8px;">
    <!-- El input file nativo -->
    <input 
      type="file" 
      accept="image/png, image/jpeg" 
      (change)="onFileSelected($event)" 
      [disabled]="cargando"
      style="margin-bottom: 15px;"
    >
    
    @if (archivoSeleccionado) {
      <p style="color: #4CAF50;">Archivo listo: {{ archivoSeleccionado.name }}</p>
    }
  </div>

  <button 
    (click)="subirArchivo()" 
    [disabled]="cargando || !archivoSeleccionado" 
    style="padding: 12px 24px; background: #6200ee; color: white; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px;">
    {{ cargando ? 'Procesando...' : 'Enviar a Validación' }}
  </button>

  @if (estado && !error) {
    <p style="color: #03dac6; margin-top: 15px;">{{ estado }}</p>
  }

  @if (error) {
    <p style="color: #cf6679; margin-top: 15px; font-weight: bold;">{{ error }}</p>
  }
</div>
